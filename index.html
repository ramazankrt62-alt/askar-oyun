<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    background: #000;
    overscroll-behavior: none;
  }
  body {
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #root {
    min-height: 100vh;
    width: 100%;
    background: #000;
  }
  body {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    overscroll-behavior: none;
    font-family: system-ui, -apple-system, sans-serif;
  }
  canvas { image-rendering: pixelated; }
  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 20px;
    background: radial-gradient(ellipse at top, #1a1a3e 0%, #0a0a1f 50%, #000 100%);
    color: #ffd700; font-family: Georgia, serif;
    z-index: 9999;
  }
  #loading h1 {
    font-size: 4rem; font-weight: 900; letter-spacing: 0.1em;
    background: linear-gradient(180deg, #ffd700 0%, #f59e0b 30%, #c8102e 60%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 0 #3e2723);
    margin: 0;
  }
  #loading p { color: #c0a050; font-size: 0.9rem; letter-spacing: 0.2em; }
  .spinner {
    width: 40px; height: 40px;
    border: 4px solid #3e2723; border-top: 4px solid #ffd700;
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

</script>
<script>
(function(){
  var LS = function(k){ return localStorage.getItem(k); };
  var LSset = function(k,v){ localStorage.setItem(k,v); };
  function getCoins(){ return parseInt(LS('askarCoins')||'0',10); }
  function setCoins(v){ LSset('askarCoins', String(Math.max(0,v))); }
  function getDiamonds(){ return parseInt(LS('askarDiamonds')||'0',10); }
  function setDiamonds(v){ LSset('askarDiamonds', String(Math.max(0,v))); }
  function getWeapons(){ try{ return JSON.parse(LS('askarWeapons')||'["sword"]'); }catch(e){ return ['sword']; } }
  function setWeapons(arr){ LSset('askarWeapons', JSON.stringify(arr)); }
  var ALL_WEAPONS = ['sword','dagger','mace','spear','axe','flame','crescent','lightning'];
  var isTR = (LS('askarLang')||'tr') !== 'en';
  function T(tr,en){ return isTR ? tr : en; }

  function todayKey(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function weekKey(){ var d=new Date(); var onejan=new Date(d.getFullYear(),0,1); var week=Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7); return d.getFullYear()+'-W'+week; }

  var style = document.createElement('style');
  style.textContent =
    '#askarExtraBtn{position:fixed;bottom:16px;left:16px;z-index:9998;background:linear-gradient(180deg,#7e22ce,#4c1d95);color:#fef3c7;border:2px solid #c8a2ff;border-radius:9999px;padding:10px 16px;font-weight:800;font-family:system-ui;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.5);cursor:pointer;}'+
    '#askarExtraBtn:active{transform:scale(.95);}'+
    '#askarExtraOverlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px;font-family:system-ui;}'+
    '#askarExtraOverlay.open{display:flex;}'+
    '.askarPanel{background:linear-gradient(180deg,#1e293b,#0f172a);border:2px solid #eab308;border-radius:16px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;padding:20px;color:#fef9c3;}'+
    '.askarPanel h2{margin:0 0 12px;font-size:22px;font-weight:900;text-align:center;color:#facc15;}'+
    '.askarRow{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(234,179,8,.3);border-radius:10px;padding:10px 12px;margin-bottom:8px;}'+
    '.askarTabs{display:flex;gap:6px;margin-bottom:14px;}'+
    '.askarTab{flex:1;padding:8px;border-radius:8px;background:#334155;color:#cbd5e1;font-weight:700;font-size:12px;text-align:center;cursor:pointer;border:1px solid transparent;}'+
    '.askarTab.active{background:#eab308;color:#000;}'+
    '.askarBtn{background:linear-gradient(180deg,#eab308,#a16207);color:#000;font-weight:800;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12px;white-space:nowrap;}'+
    '.askarBtn:disabled{background:#475569;color:#94a3b8;cursor:not-allowed;}'+
    '.askarClose{position:absolute;top:10px;right:14px;background:none;border:none;color:#fca5a5;font-size:22px;cursor:pointer;}'+
    '#askarToast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#a16207,#eab308);color:#000;font-weight:800;padding:10px 18px;border-radius:9999px;z-index:10000;display:none;font-family:system-ui;font-size:13px;box-shadow:0 4px 10px rgba(0,0,0,.5);}';
  document.head.appendChild(style);

  var toastEl=document.createElement('div'); toastEl.id='askarToast';
  document.body.appendChild(toastEl);
  function toast(msg){
    toastEl.textContent=msg; toastEl.style.display='block';
    clearTimeout(toastEl._h); toastEl._h=setTimeout(function(){ toastEl.style.display='none'; },2200);
  }

  var btn=document.createElement('button');
  btn.id='askarExtraBtn';
  btn.textContent='💎 '+T('Ekstra','Extra');
  document.body.appendChild(btn);

  var overlay=document.createElement('div'); overlay.id='askarExtraOverlay';
  document.body.appendChild(overlay);

  var activeTab='chest';

  function renderCoinsDiamonds(){
    return '<div style="display:flex;gap:10px;justify-content:center;margin-bottom:14px;">'+
      '<div class="askarRow" style="flex:1;justify-content:center;gap:6px;"><span>🪙</span><b>'+getCoins()+'</b></div>'+
      '<div class="askarRow" style="flex:1;justify-content:center;gap:6px;"><span>💎</span><b>'+getDiamonds()+'</b></div>'+
    '</div>';
  }

  var CHESTS = [
    {id:'normal', name:T('Normal Sandık','Common Chest'), cost:100, emoji:'📦', goldMin:50,goldMax:150, diamondChance:.1, diamondMin:5,diamondMax:15, weaponChance:.03},
    {id:'rare', name:T('Nadir Sandık','Rare Chest'), cost:300, emoji:'🎁', goldMin:150,goldMax:400, diamondChance:.2, diamondMin:15,diamondMax:35, weaponChance:.08},
    {id:'epic', name:T('Destansı Sandık','Epic Chest'), cost:700, emoji:'🎉', goldMin:400,goldMax:900, diamondChance:.35, diamondMin:35,diamondMax:80, weaponChance:.18},
    {id:'legendary', name:T('Efsanevi Sandık','Legendary Chest'), cost:1500, emoji:'👑', goldMin:900,goldMax:2000, diamondChance:.6, diamondMin:80,diamondMax:200, weaponChance:.4}
  ];

  function openChest(chest, free){
    if(!free){
      if(getDiamonds()<chest.cost){ toast(T('Yetersiz elmas!','Not enough diamonds!')); return; }
      setDiamonds(getDiamonds()-chest.cost);
    }
    var gold = Math.floor(chest.goldMin + Math.random()*(chest.goldMax-chest.goldMin));
    setCoins(getCoins()+gold);
    var msg = '+'+gold+' 🪙';
    if(Math.random()<chest.diamondChance){
      var dia = Math.floor(chest.diamondMin + Math.random()*(chest.diamondMax-chest.diamondMin));
      setDiamonds(getDiamonds()+dia);
      msg += '  +'+dia+' 💎';
    }
    if(Math.random()<chest.weaponChance){
      var owned = getWeapons();
      var locked = ALL_WEAPONS.filter(function(w){ return owned.indexOf(w)===-1; });
      if(locked.length){
        var w = locked[Math.floor(Math.random()*locked.length)];
        setWeapons(owned.concat([w]));
        msg += '  🗡️ '+T('Yeni silah','New weapon')+': '+w;
      }
    }
    toast(msg);
    renderPanel();
  }

  function claimDaily(){
    var last = LS('askarLastDaily');
    if(last===todayKey()){ toast(T('Bugün zaten aldın!','Already claimed today!')); return; }
    var streak = parseInt(LS('askarDailyStreak')||'0',10);
    var yesterday = new Date(Date.now()-86400000);
    var yKey = yesterday.getFullYear()+'-'+(yesterday.getMonth()+1)+'-'+yesterday.getDate();
    streak = (last===yKey) ? streak+1 : 1;
    LSset('askarDailyStreak', String(streak));
    LSset('askarLastDaily', todayKey());
    var gold = 100 + streak*20;
    var dia = 10 + Math.floor(streak/2);
    setCoins(getCoins()+gold);
    setDiamonds(getDiamonds()+dia);
    toast(T('Günlük ödül','Daily reward')+'! +'+gold+' 🪙 +'+dia+' 💎 ('+streak+' '+T('gün seri','day streak')+')');
    renderPanel();
  }

  function claimWeekly(){
    var last = LS('askarLastWeekly');
    if(last===weekKey()){ toast(T('Bu hafta zaten aldın!','Already claimed this week!')); return; }
    LSset('askarLastWeekly', weekKey());
    setCoins(getCoins()+800);
    setDiamonds(getDiamonds()+80);
    toast(T('Haftalık ödül! +800 🪙 +80 💎','Weekly reward! +800 🪙 +80 💎'));
    renderPanel();
  }

  function renderPanel(){
    var dailyDone = LS('askarLastDaily')===todayKey();
    var weeklyDone = LS('askarLastWeekly')===weekKey();
    var body='';
    if(activeTab==='chest'){
      body = CHESTS.map(function(c){
        return '<div class="askarRow"><div>'+c.emoji+' <b>'+c.name+'</b><br><span style="font-size:11px;opacity:.7;">💎 '+c.cost+'</span></div>'+
          '<button class="askarBtn" data-chest="'+c.id+'">'+T('AÇ','OPEN')+'</button></div>';
      }).join('');
    } else if(activeTab==='reward'){
      body =
        '<div class="askarRow"><div>🎁 '+T('Günlük Ödül','Daily Reward')+'<br><span style="font-size:11px;opacity:.7;">'+T('Seri','Streak')+': '+(LS('askarDailyStreak')||0)+'</span></div><button class="askarBtn" id="dailyBtn" '+(dailyDone?'disabled':'')+'>'+(dailyDone?T('ALINDI','DONE'):T('AL','CLAIM'))+'</button></div>'+
        '<div class="askarRow"><div>🎁 '+T('Haftalık Ödül','Weekly Reward')+'<br><span style="font-size:11px;opacity:.7;">+800 🪙 +80 💎</span></div><button class="askarBtn" id="weeklyBtn" '+(weeklyDone?'disabled':'')+'>'+(weeklyDone?T('ALINDI','DONE'):T('AL','CLAIM'))+'</button></div>';
    }
    overlay.innerHTML = '<div class="askarPanel" style="position:relative;">'+
      '<button class="askarClose" id="askarCloseBtn">✕</button>'+
      '<h2>💎 '+T('Ekstra Sistemler','Extra Systems')+'</h2>'+
      renderCoinsDiamonds()+
      '<div class="askarTabs">'+
        '<div class="askarTab '+(activeTab==='chest'?'active':'')+'" data-tab="chest">📦 '+T('Sandıklar','Chests')+'</div>'+
        '<div class="askarTab '+(activeTab==='reward'?'active':'')+'" data-tab="reward">🎁 '+T('Ödüller','Rewards')+'</div>'+
      '</div>'+
      '<div>'+body+'</div>'+
      '<p style="font-size:10px;opacity:.5;text-align:center;margin-top:14px;">'+T('Not: Kazanılan silahlar sayfa yenilendiğinde oyunda görünür.','Note: Unlocked weapons appear in-game after page reload.')+'</p>'+
    '</div>';

    overlay.querySelector('#askarCloseBtn').onclick=function(){ overlay.classList.remove('open'); };
    var tabs = overlay.querySelectorAll('.askarTab');
    for(var i=0;i<tabs.length;i++){ tabs[i].onclick=(function(el){ return function(){ activeTab=el.getAttribute('data-tab'); renderPanel(); }; })(tabs[i]); }
    var chestBtns = overlay.querySelectorAll('[data-chest]');
    for(var j=0;j<chestBtns.length;j++){ chestBtns[j].onclick=(function(el){ return function(){
      var c=null; for(var k=0;k<CHESTS.length;k++){ if(CHESTS[k].id===el.getAttribute('data-chest')) c=CHESTS[k]; }
      if(c) openChest(c,false);
    }; })(chestBtns[j]); }
    var dailyBtn=overlay.querySelector('#dailyBtn'); if(dailyBtn) dailyBtn.onclick=claimDaily;
    var weeklyBtn=overlay.querySelector('#weeklyBtn'); if(weeklyBtn) weeklyBtn.onclick=claimWeekly;
  }

  btn.onclick=function(){ overlay.classList.add('open'); renderPanel(); };

  setTimeout(function(){
    if(LS('askarLastDaily')!==todayKey()){
      toast('🎁 '+T('Günlük ödülün hazır! Sol alttaki butona dokun.','Your daily reward is ready! Tap the button bottom-left.'));
    }
  }, 4000);

  function updateBtnVisibility(){
    var inGame = !!document.querySelector('canvas');
    btn.style.display = inGame ? 'none' : 'block';
    if(inGame) overlay.classList.remove('open');
  }
  var root = document.getElementById('root');
  if(root){
    var mo = new MutationObserver(updateBtnVisibility);
    mo.observe(root, {childList:true, subtree:true});
  }
  updateBtnVisibility();
  setInterval(updateBtnVisibility, 1000);
})();
</script>

<!-- ===== AdMob Entegrasyonu (Capacitor) ===== -->
<script type="module">
  // Bu kod yalnizca uygulama Android/iOS icinde (Capacitor) calisirken devreye girer.
  // Normal tarayicida acildiginda hicbir sey yapmaz, oyunu etkilemez.
  window.addEventListener('DOMContentLoaded', async function () {
    if (!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) {
      return; // Tarayicida calisiyorsa AdMob'u atla
    }
    try {
      const { AdMob } = await import('@capacitor-community/admob');

      await AdMob.initialize({
        // testingDevices: [],
        initializeForTesting: false,
      });

      // --- BANNER REKLAM: oyun acilinca alt kisimda gosterilir ---
      await AdMob.showBanner({
        adId: 'ca-app-pub-6000338563277528/6161403992', // Ad Unit ID
        adSize: 'ADAPTIVE_BANNER',
        position: 'BOTTOM_CENTER',
        margin: 0,
      });

      // --- INTERSTITIAL (tam ekran) REKLAM: onceden yuklenir ---
      await AdMob.prepareInterstitial({
        adId: 'ca-app-pub-6000338563277528/6161403992', // Ayni ad unit; isterseniz ayri bir interstitial ad unit olusturup buraya yazabilirsiniz
      });

      // Global fonksiyon: oyun kodunuzdan (ornegin "oyun bitti" ekraninda)
      // window.showInterstitialAd() cagirarak tam ekran reklam gosterebilirsiniz.
      window.showInterstitialAd = async function () {
        try {
          await AdMob.showInterstitial();
          // Bir sonraki gosterim icin yeniden yukle
          await AdMob.prepareInterstitial({
            adId: 'ca-app-pub-6000338563277528/6161403992',
          });
        } catch (e) {
          console.log('Interstitial reklam gosterilemedi:', e);
        }
      };
    } catch (e) {
      console.log('AdMob baslatilamadi:', e);
    }
  });
</script>
